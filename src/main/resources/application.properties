# allow overriding via env vars (SPRING_DATASOURCE_URL etc)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/marketplace?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.context-path=/

jwt.secret=${JWT_SECRET:YOUR_STRONG_JWT_SECRET_KEY_GOES_HERE_64_CHARS_RANDOM}
jwt.expirationMs=86400000
